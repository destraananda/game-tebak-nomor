<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kuis Tebak-Tebakan v12.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        :root {
            --bg-main: #1e1b4b; --bg-dark: #000; --text-main: #f8fafc;
            --primary: #8b5cf6; --primary-glow: rgba(139, 92, 246, 0.6);
            --accent: #fbbf24; --success: #10b981; --danger: #ef4444;
        }
        body.theme-matrix { --bg-main: #022c22; --primary: #10b981; --primary-glow: rgba(16, 185, 129, 0.6); --accent: #34d399; --text-main: #ecfdf5; }
        body.theme-cyber { --bg-main: #1e1e24; --primary: #fbbf24; --primary-glow: rgba(251, 191, 36, 0.6); --accent: #f59e0b; --text-main: #fef3c7; --danger: #f97316; }
        body.theme-boss { --bg-main: #450a0a; --primary: #ef4444; --primary-glow: rgba(239, 68, 68, 0.8); --accent: #fbbf24; --text-main: #fef2f2; --success: #10b981; }

        body {
            background: var(--bg-dark); display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; color: var(--text-main); overflow: hidden; position: relative;
            transition: background 0.5s;
        }

        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 6px 100%; pointer-events: none; z-index: 999; box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .particle { position: absolute; background: var(--primary); border-radius: 50%; animation: floatUp linear infinite, pulseBg 2s ease-in-out infinite alternate; z-index: 0; opacity: 0.3; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); } 100% { transform: translateY(-10vh) scale(1.5); } }
        @keyframes pulseBg { from { opacity: 0.1; } to { opacity: 0.6; } }

        .flash-red { animation: flashRed 0.4s; }
        @keyframes flashRed { 0%, 100% { background: var(--bg-dark); } 50% { background: #7f1d1d; } }
        .flash-gold { animation: flashGold 0.5s; }
        @keyframes flashGold { 0%, 100% { background: var(--bg-dark); } 50% { background: var(--accent); } }
        
        .glitch { animation: shakeHard 0.4s cubic-bezier(.36,.07,.19,.97) both; filter: drop-shadow(0 0 15px var(--danger)); }
        @keyframes shakeHard {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-8px, 5px) rotate(-1.5deg); }
            20%, 40%, 60%, 80% { transform: translate(8px, -5px) rotate(1.5deg); }
        }

        .game-container {
            background: var(--bg-main); border: 4px solid var(--primary);
            box-shadow: 0 0 0 4px var(--bg-dark), 0 0 30px var(--primary-glow);
            padding: 20px; border-radius: 10px; text-align: center; width: 420px;
            position: relative; z-index: 10; transition: 0.5s;
            animation: fadeInUp 0.8s ease-out;
            max-height: 95vh; overflow-y: auto;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .win-punch { animation: winPunch 0.5s ease-in-out; }
        @keyframes winPunch { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 50px var(--success); } 100% { transform: scale(1); } }

        .game-container.boss-level { border-color: var(--danger); box-shadow: 0 0 0 4px #000, 0 0 50px var(--danger); animation: bossPulse 1s infinite; }
        @keyframes bossPulse { 0%, 100% { box-shadow: 0 0 0 4px #000, 0 0 30px var(--danger); } 50% { box-shadow: 0 0 0 4px #000, 0 0 70px var(--danger); } }

        .mascot-container { position: relative; display: inline-block; margin-bottom: 5px; }
        #mascot { font-size: 50px; display: inline-block; animation: float 2s infinite; cursor: pointer;}
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .mascot-bounce { animation: mascotBounce 0.4s ease; }
        @keyframes mascotBounce { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.2) translateY(-15px); } }

        #speechBubble { position: absolute; top: -20px; left: 80%; background: #fff; color: #000; padding: 8px 12px; border-radius: 15px; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; transition: 0.3s; pointer-events: none; border: 2px solid var(--bg-dark); z-index: 20;}
        #speechBubble::after { content: ''; position: absolute; bottom: -8px; left: 10px; border-width: 8px 8px 0; border-style: solid; border-color: #fff transparent transparent transparent; }
        #speechBubble.show { opacity: 1; top: -30px; transform: scale(1.1); }

        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 20; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border-radius: 6px;
        }
        #startScreen h1 { font-family: 'Press Start 2P', cursive; color: var(--accent); font-size: 20px; margin-bottom: 10px; text-align: center; line-height: 1.5; text-shadow: 2px 2px 0 #000; }
        .stats-preview { display: flex; gap: 15px; margin-bottom: 20px; font-size: 12px; font-weight: bold; color: var(--text-main); background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
        
        h2 { font-family: 'Press Start 2P', cursive; margin: 0; color: var(--accent); font-size: 14px; line-height: 1.5; text-shadow: 2px 2px 0 #000; }
        #rankDisplay { font-size: 12px; font-weight: 800; color: var(--accent); margin-bottom: 10px; display: block; text-transform: uppercase; letter-spacing: 1px;}
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-weight: 700; font-size: 12px;}
        .level-box { background: var(--primary); padding: 5px 10px; border-radius: 5px; border: 2px solid var(--bg-dark); }
        .coins-box { background: var(--accent); color: #000; padding: 5px 10px; border-radius: 5px; border: 2px solid var(--bg-dark); cursor: pointer; transition: 0.2s; }
        .coins-box:hover { transform: scale(1.1); }
        
        .stats-bar { display: flex; justify-content: space-between; background: var(--bg-dark); padding: 8px 10px; border-radius: 5px; margin-bottom: 10px; font-size: 12px; border: 2px solid #334155; }
        .stats-bar span { color: var(--accent); font-weight: bold;}
        
        #timeBarContainer { width: 100%; height: 8px; background: #334155; border-radius: 5px; margin-bottom: 10px; display: none; overflow: hidden; border: 1px solid var(--bg-dark);}
        #timeBar { height: 100%; background: var(--success); width: 100%; transition: width 0.1s linear; }
        .time-danger { background: var(--danger) !important; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #lives-display { font-size: 20px; letter-spacing: 5px; margin-bottom: 10px; }

        .inventory-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .inv-item { background: #334155; border: 1px solid #000; border-radius: 5px; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px;}
        .inv-item:hover { background: #475569; transform: translateY(-2px); }
        .inv-item:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        /* KUIS STYLE */
        #questionText { font-size: 16px; font-weight: 700; color: #fff; margin: 15px 0; min-height: 50px; line-height: 1.4; text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent);}
        
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .option-btn { 
            background: #334155; color: white; padding: 12px 15px; border-radius: 8px; border: 2px solid var(--bg-dark); 
            text-align: left; font-size: 14px; cursor: pointer; transition: 0.2s; font-weight: 600;
            box-shadow: 0 2px 0 var(--bg-dark); display: flex; align-items: center; gap: 10px;
        }
        .option-btn:hover:not(:disabled) { background: #475569; transform: translateX(5px); }
        .option-btn:disabled { opacity: 0.7; cursor: not-allowed; box-shadow: 0 0 0 var(--bg-dark); transform: translateY(2px); }
        .option-btn.correct { background: var(--success); color: black; border-color: #000; }
        .option-btn.wrong { background: var(--danger); color: white; border-color: #000; }
        .option-btn.hidden-5050 { opacity: 0; pointer-events: none; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        
        button {
            background: var(--success); color: #000; border: 2px solid var(--bg-dark); padding: 10px;
            font-size: 12px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.1s; width: 100%;
            box-shadow: 0 4px 0 var(--bg-dark);
        }
        button:active { transform: translateY(4px) scaleY(0.95); box-shadow: 0 0 0 var(--bg-dark); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: translateY(4px); box-shadow: 0 0 0 var(--bg-dark); }
        
        .hint-btn { background: var(--accent); }
        .shop-btn { background: #ec4899; color: white; }
        .music-btn { background: #38bdf8; }
        .skip-btn { background: #a855f7; color: white; }
        .spin-btn { background: #f97316; color: white; }
        .share-btn { background: #25D366; display: none; margin-top: 10px; }
        #resetBtn { background: var(--danger); color: white; display: none; }

        #pesan { margin-top: 15px; font-weight: 600; font-size: 14px; min-height: 24px; color: var(--text-main);}

        #levelUpText { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Press Start 2P', cursive; font-size: 40px; z-index: 1000; display: none; animation: popText 1s forwards, rainbowText 0.5s infinite linear; }
        @keyframes popText { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
        @keyframes rainbowText { 0% { color: #ff0000; text-shadow: 4px 4px 0 #000; } 20% { color: #ffff00; } 40% { color: #00ff00; } 60% { color: #00ffff; } 80% { color: #ff00ff; } 100% { color: #ff0000; } }

        .floating-text { position: fixed; font-family: 'Press Start 2P', cursive; font-size: 20px; z-index: 9999; pointer-events: none; text-shadow: 2px 2px 0 #000; animation: floatUpFade 1.5s forwards ease-out; }
        @keyframes floatUpFade { 0% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -100px) scale(1.5); } }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-main); padding: 20px; border-radius: 10px; width: 380px; text-align: center; border: 4px solid var(--accent); max-height: 85vh; overflow-y: auto; animation: fadeInUp 0.3s ease-out;}
        
        .shop-tabs { display: flex; margin-bottom: 15px; gap: 5px; }
        .shop-tab { flex: 1; background: #334155; color: white; padding: 8px 5px; border: none; box-shadow: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 11px; transition: 0.2s;}
        .shop-tab.active { background: var(--accent); color: black; }
        .shop-tab:hover:not(.active) { background: #475569; }

        .shop-item { background: var(--bg-dark); padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 2px solid #334155;}
        .shop-icon { font-size: 20px; }
        .shop-btn-buy { width: auto; padding: 5px 10px; font-size: 10px; box-shadow: 0 2px 0 var(--bg-dark);}
        .achievement-locked { filter: grayscale(100%); opacity: 0.5; }

        /* === LUCKY SPIN WHEEL === */
        .wheel-container { position: relative; width: 250px; height: 250px; margin: 20px auto; }
        .wheel { 
            width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--accent); 
            background: conic-gradient(
                var(--danger) 0deg 45deg, var(--success) 45deg 90deg, var(--primary) 90deg 135deg, #f97316 135deg 180deg, 
                #06b6d4 180deg 225deg, #ec4899 225deg 270deg, #eab308 270deg 315deg, #64748b 315deg 360deg
            );
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .wheel-text { position: absolute; top: 50%; left: 50%; width: 50%; height: 20px; transform-origin: left center; font-size: 10px; font-weight: bold; color: white; display: flex; align-items: center; padding-left: 20px; text-shadow: 1px 1px 2px #000; }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--accent); z-index: 5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .spin-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: var(--bg-dark); border: 3px solid var(--accent); border-radius: 50%; z-index: 4; display: flex; justify-content: center; align-items: center; font-size: 16px; }

        @media (max-height: 750px) {
            .game-container { transform: scale(0.85); transform-origin: center; }
            #mascot { font-size: 40px; }
            .stats-bar, .top-bar { margin: 5px 0; }
            .btn-group { margin-top: 5px; }
        }
    </style>
</head>
<body id="body">
    <div class="crt-overlay"></div>
    <div id="levelUpText">LEVEL UP!</div>

    <audio id="bgm" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-games-in-the-arcade-2439.mp3" type="audio/mpeg">
    </audio>

    <div class="game-container" id="gameBox">
        
        <div id="startScreen">
            <h1>Kuis<br>Tebak-Tebakan</h1>
            <div class="stats-preview">
                <div>🏆 Menang: <span id="statWins">0</span></div>
                <div>💀 Kalah: <span id="statLosses">0</span></div>
                <div>🔥 Max Streak: <span id="statMaxStreak">0</span></div>
            </div>
            <button onclick="mulaiGame()" style="width: 80%; background: var(--accent);">MULAI BERMAIN</button>
            <button onclick="bukaPencapaian()" style="width: 80%; background: #334155; color: white; margin-top:10px;">🏅 PENCAPAIAN</button>
            <p style="font-size:10px; color:#94a3b8; margin-top:15px;">(Tekan ENTER untuk mulai)</p>
        </div>

        <div class="mascot-container">
            <div id="mascot" onclick="clickMascot()" title="Klik aku!">🤔</div>
            <div id="speechBubble">Halo!</div>
        </div>

        <h2 id="gameTitle">Kuis Tebak-Tebakan</h2>
        <span id="rankDisplay">Noob 🐣</span>
        
        <div class="top-bar">
            <div class="level-box">Lvl: <span id="levelDisplay">1</span></div>
            <div class="coins-box" onclick="bukaToko()">🪙 <span id="coinDisplay">0</span></div>
        </div>

        <div class="stats-bar">
            <div>⏱️ <span id="timer">0</span>s</div>
            <div>🔥 Streak: <span id="streakDisplay">0</span></div>
        </div>

        <div id="timeBarContainer"><div id="timeBar"></div></div>

        <!-- KUIS AREA -->
        <div id="questionText">Loading pertanyaan...</div>
        <div class="options-grid" id="optionsContainer">
            <!-- Opsi A, B, C, D akan di-generate JS -->
        </div>
        
        <div id="lives-display">❤️❤️❤️</div>
        
        <div class="inventory-bar">
            <button class="inv-item" id="btnTime" onclick="pakaiItem('time')" title="Tambah Waktu">⏳ x<span id="invTime">0</span></button>
            <button class="inv-item" id="btnRange" onclick="pakaiItem('range')" title="50:50 (Hapus 2 jawaban salah)">🎯 x<span id="invRange">0</span></button>
            <button class="inv-item" id="btnWin" onclick="pakaiItem('win')" title="Instan Win">💎 x<span id="invWin">0</span></button>
        </div>
        
        <div class="btn-group">
            <button id="hintBtn" class="hint-btn" onclick="beliHint()">HINT (5 🪙)</button>
        </div>
        
        <div class="btn-group">
            <button id="shopBtn" class="shop-btn" onclick="beliNyawa()">NYAWA (15 🪙)</button>
            <button id="skipBtn" class="skip-btn" onclick="skipLevel()">SKIP (100 🪙)</button>
        </div>
        
        <div class="btn-group">
            <button class="music-btn" onclick="toggleMusic()" style="width: 33%;">🔇 MUSIK</button>
            <button class="spin-btn" onclick="bukaSpin()" style="width: 34%;">🎰 SPIN</button>
            <button class="skip-btn" onclick="bukaLeaderboard()" style="margin-top:0; width: 33%; background:#fbbf24; color:#000;">🏆 REKOR</button>
        </div>

        <button id="resetBtn" onclick="nextOrReset()" style="margin-top: 10px;">LANJUT</button>
        <button id="shareBtn" class="share-btn" onclick="bagikanSkor()">BAGIKAN SKOR</button>
        
        <p id="pesan"></p>
    </div>

    <!-- MODAL TOKO -->
    <div class="modal" id="modalToko">
        <div class="modal-content">
            <h3 style="color: var(--accent); font-family: 'Press Start 2P'; font-size: 14px;">TOKO</h3>
            <div class="shop-tabs">
                <button class="shop-tab active" id="tabAvatar" onclick="gantiTab('avatar')">Avatar</button>
                <button class="shop-tab" id="tabTema" onclick="gantiTab('tema')">Tema</button>
                <button class="shop-tab" id="tabItem" onclick="gantiTab('item')">Item</button>
            </div>
            <div id="listToko"></div>
            <button onclick="tutupModal('modalToko')" style="margin-top: 15px; background:var(--danger); color:white;">TUTUP</button>
        </div>
    </div>

    <!-- MODAL LEADERBOARD -->
    <div class="modal" id="modalLeaderboard">
        <div class="modal-content">
            <h3 style="color: var(--accent); font-family: 'Press Start 2P'; font-size: 14px;">HALL OF FAME</h3>
            <div id="listLeaderboard" style="margin-top: 15px;"></div>
            <button onclick="tutupModal('modalLeaderboard')" style="margin-top: 15px; background:var(--danger); color:white;">TUTUP</button>
        </div>
    </div>

    <!-- MODAL PENCAPAIAN -->
    <div class="modal" id="modalAchievement">
        <div class="modal-content">
            <h3 style="color: var(--accent); font-family: 'Press Start 2P'; font-size: 14px;">PENCAPAIAN</h3>
            <div id="listAchievement" style="margin-top: 15px;"></div>
            <button onclick="tutupModal('modalAchievement')" style="margin-top: 15px; background:var(--danger); color:white;">TUTUP</button>
        </div>
    </div>

    <!-- MODAL LUCKY SPIN -->
    <div class="modal" id="modalSpin">
        <div class="modal-content" style="width: 320px;">
            <h3 style="color: var(--accent); font-family: 'Press Start 2P'; font-size: 14px;">LUCKY SPIN</h3>
            <p style="font-size: 12px; margin-top:5px;">Biaya: 50 🪙</p>
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="spin-center">🎰</div>
                <div class="wheel" id="wheel"></div>
            </div>
            <button id="btnSpinAction" onclick="spinWheel()" style="background: var(--accent); color: black; margin-top:10px;">PUTAR RODA!</button>
            <button onclick="tutupModal('modalSpin')" style="margin-top: 10px; background:var(--danger); color:white;">TUTUP</button>
        </div>
    </div>

    <script>
        // ==== VARIABEL GLOBAL ====
        let level = parseInt(localStorage.getItem('saveLevel_v13')) || 1;
        let currentQuestion, kesempatan, gameSelesai = false, riwayat = [], totalTebakan = 0, isDaily = false;
        let currentStreak = parseInt(localStorage.getItem('currentStreak_v13')) || 0;
        let coins = parseInt(localStorage.getItem('playerCoins_v13')) || 0;
        
        let stats = JSON.parse(localStorage.getItem('stats_v13')) || { wins: 0, losses: 0, maxStreak: 0 };
        let inventory = JSON.parse(localStorage.getItem('inventory_v13')) || { time: 1, range: 1, win: 0 };
        
        let myAvatar = localStorage.getItem('myAvatar_v13') || '🤔';
        let currentTheme = localStorage.getItem('myTheme_v13') || 'default';
        let ownedAvatars = JSON.parse(localStorage.getItem('ownedAvatars_v13')) || ['🤔'];
        let ownedThemes = JSON.parse(localStorage.getItem('ownedThemes_v13')) || ['default'];
        let achievements = JSON.parse(localStorage.getItem('achievements_v13')) || [];

        let timeElapsed = 0, timerInterval, timerStarted = false;
        let timeAttackInterval, timeLeft = 10, maxTime = 10; 
        let isTimeAttack = false;
        let gameAktif = false;
        let isBossLevel = false;
        let isSpinning = false;
        let answerLocked = false;

        // ==== BANK SOAL TEBAK-TEBAKAN ====
        const questions = [
            { q: "Bapaknya bernama Budi, anaknya bernama...", o: ["Budo", "Buda", "Bidi", "Bede"], a: 0 },
            { q: "Hewan apa yang paling kaya?", o: ["Kucing", "Beruang", "Semut", "Cicak"], a: 1 },
            { q: "Benda mana yang lebih berat: 1 kg kapas atau 1 kg besi?", o: ["Kapas", "Besi", "Sama Saja", "Tergantung"], a: 2 },
            { q: "Ayam apa yang paling besar?", o: ["Ayam Kampung", "Ayam Bangkok", "Ayam Kalkun", "Ayam Kampus"], a: 3 },
            { q: "Kopi apa yang tidak bisa diminum?", o: ["Kopi Luwak", "Kopi Susu", "Kopi Pahit", "Kopiah"], a: 3 },
            { q: "Ikan apa yang matanya banyak?", o: ["Ikan Tongkol", "Ikan Teri", "Ikan Hiu", "Ikan Sepat"], a: 1 },
            { q: "Apa yang punya kaki tapi tidak bisa jalan?", o: ["Meja", "Kursi", "Lemari", "Semua Benar"], a: 3 },
            { q: "Bebek apa yang bisa terbang tinggi?", o: ["Bebek Goreng", "Bebek Beijing", "Bebek Peking", "Bebek Terbang"], a: 3 },

        // ==== SFX (EFEK SUARA) ====
        function playSFX(type) {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'win') {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                if (navigator.vibrate) navigator.vibrate(200);
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function pilihJawaban(index, btnElement) {

            startTimer();

            const allBtns = document.querySelectorAll(".option-btn");
            allBtns.forEach(b => b.disabled = true);

            if (index === currentQuestion.a) {

                btnElement.classList.add("correct");
                playSFX('win');
                document.getElementById("mascot").textContent = "😎";
                maskotBicara("Yes! Tepat sekali!");

            } else {

                playSFX('wrong');
                document.getElementById("mascot").textContent = "💀";

            bar.style.width = "100%"; bar.classList.remove("time-danger");

            timeAttackInterval = setInterval(() => {
                timeLeft -= 0.1;
                let persen = Math.min((timeLeft / maxTime) * 100, 100);
                if(persen < 0) persen = 0;
                bar.style.width = persen + "%";
                
                if(timeLeft <= (maxTime * 0.3)) bar.classList.add("time-danger");

                if (timeLeft <= 0) {
                    clearInterval(timeAttackInterval);
                    waktuHabis();
                }
            }, 100);

            if(gameSelesai || !gameAktif || answerLocked) return;

                let hiddenCount = 0;
                for(let i=0; i<allBtns.length; i++) {
                    if(i !== currentQuestion.a && hiddenCount < 2) {

            else if(type === 'win') {

                    tebakanBenar();

            currentShopTab = tab;
            document.getElementById("tabAvatar").classList.remove('active');
            document.getElementById("tabTema").classList.remove('active');
            document.getElementById("tabItem").classList.remove('active');
            
            if(tab === 'avatar') document.getElementById("tabAvatar").classList.add('active');
            else if(tab === 'tema') document.getElementById("tabTema").classList.add('active');
            else document.getElementById("tabItem").classList.add('active');

            const list = document.getElementById("listToko"); list.innerHTML = "";

            if(tab === 'avatar') {
                const avatars = [
                    { icon: '🤔', price: 0, name: 'Pemula' }, { icon: '😎', price: 50, name: 'Keren' },
                    { icon: '🤖', price: 150, name: 'Robot' }, { icon: '👽', price: 300, name: 'Alien' },
                    { icon: '🐉', price: 500, name: 'Naga' }
                ];
                avatars.forEach(av => {
                    const isOwned = ownedAvatars.includes(av.icon);
                    const isEquipped = myAvatar === av.icon;
                    let btnText = isOwned ? (isEquipped ? "DIPAKAI" : "PAKAI") : `BELI (${av.price} 🪙)`;
                    let btnBg = isOwned ? (isEquipped ? "#334155" : "var(--success)") : "var(--accent)";
                    list.innerHTML += `<div class="shop-item">
                        <div class="shop-icon">${av.icon}</div>
                        <div style="flex:1; text-align:left; margin-left:10px; font-weight:bold; font-size:14px;">${av.name}</div>
                        <button class="shop-btn-buy" style="background:${btnBg}" onclick="prosesAvatar('${av.icon}', ${av.price})">${btnText}</button>
                    </div>`;
                });
            } 
            else if (tab === 'tema') {
                const themes = [
                    { id: 'default', price: 0, name: 'Default (Ungu)' },
                    { id: 'matrix', price: 150, name: 'Matrix (Hijau)' },
                    { id: 'cyber', price: 250, name: 'Cyberpunk (Kuning)' }
                ];
                themes.forEach(th => {
                    const isOwned = ownedThemes.includes(th.id);
                    const isEquipped = currentTheme === th.id;
                    let btnText = isOwned ? (isEquipped ? "DIPAKAI" : "PAKAI") : `BELI (${th.price} 🪙)`;
                    let btnBg = isOwned ? (isEquipped ? "#334155" : "var(--success)") : "var(--accent)";
                    list.innerHTML += `<div class="shop-item">
                        <div style="flex:1; text-align:left; font-weight:bold; font-size:14px;">${th.name}</div>
                        <button class="shop-btn-buy" style="background:${btnBg}" onclick="prosesTema('${th.id}', ${th.price})">${btnText}</button>
                    </div>`;
                });
            }
            else {
                const items = [
                    { id: 'time', icon: '⏳', price: 20, name: 'Beli Waktu (+5s)' },
                    { id: 'range', icon: '🎯', price: 30, name: '50:50 (Hapus 2)' },
                    { id: 'win', icon: '💎', price: 500, name: 'Instan Win' }
                ];
                items.forEach(it => {
                    list.innerHTML += `<div class="shop-item">
                        <div class="shop-icon">${it.icon}</div>
                        <div style="flex:1; text-align:left; margin-left:10px; font-weight:bold; font-size:14px;">${it.name}</div>
                        <button class="shop-btn-buy" style="background:var(--success)" onclick="beliItem('${it.id}', ${it.price})">BELI (${it.price} 🪙)</button>
                    </div>`;
                });
            }
        }

        function prosesAvatar(icon, price) {
            if (ownedAvatars.includes(icon)) {
                myAvatar = icon; localStorage.setItem('myAvatar_v13', icon);
                document.getElementById("mascot").textContent = myAvatar;
                gantiTab('avatar');
            } else {
                if (coins >= price) {
                    if(confirm(`Beli avatar ini seharga ${price} koin?`)) {
                        coins -= price; updateCoinUI();
                        ownedAvatars.push(icon); localStorage.setItem('ownedAvatars_v13', JSON.stringify(ownedAvatars));
                        myAvatar = icon; localStorage.setItem('myAvatar_v13', icon);
                        document.getElementById("mascot").textContent = myAvatar;
                        playSFX('coin'); alert("✅ Avatar dibeli!"); gantiTab('avatar');
                    }
                } else alert("❌ Koin tidak cukup!");
            }
        }

        function prosesTema(id, price) {
            if (ownedThemes.includes(id)) {
                currentTheme = id; localStorage.setItem('myTheme_v13', id);
                applyTheme(currentTheme); gantiTab('tema');
            } else {
                if (coins >= price) {
                    if(confirm(`Beli tema ini seharga ${price} koin?`)) {
                        coins -= price; updateCoinUI();
                        ownedThemes.push(id); localStorage.setItem('ownedThemes_v13', JSON.stringify(ownedThemes));
                        currentTheme = id; localStorage.setItem('myTheme_v13', id);
                        applyTheme(currentTheme); playSFX('coin'); alert("✅ Tema dibeli!"); gantiTab('tema');
                    }
                } else alert("❌ Koin tidak cukup!");
            }
        }

        function beliItem(id, price) {
            if (coins >= price) {
                if(confirm(`Beli item ini seharga ${price} koin?`)) {
                    coins -= price; updateCoinUI();
                    inventory[id]++; updateInventoryUI();
                    playSFX('coin'); alert("✅ Item dibeli dan masuk ke tas!");
                }
            } else alert("❌ Koin tidak cukup!");
        }

        function bukaLeaderboard() {
            document.getElementById("modalLeaderboard").style.display = "flex";
            const list = document.getElementById("listLeaderboard"); list.innerHTML = "";
            let rekors = JSON.parse(localStorage.getItem('leaderboard_v13')) || [];
            
            if(rekors.length === 0) {
                list.innerHTML = "<p style='color:#94a3b8'>Belum ada rekor. Ayo bermain!</p>";
            } else {
                rekors.forEach((waktu, index) => {
                    let medali = index === 0 ? "🥇" : (index === 1 ? "🥈" : (index === 2 ? "🥉" : "🏅"));
                    list.innerHTML += `<div class="shop-item">
                        <div style="font-size:20px;">${medali}</div>
                        <div style="flex:1; text-align:left; margin-left:15px; font-weight:bold; font-size:16px;">Peringkat ${index + 1}</div>
                        <div style="color:var(--accent); font-weight:bold;">${waktu} Detik</div>
                    </div>`;
                });
            }
        }

        // ==== LUCKY SPIN LOGIC ====
        function initWheel() {
            const wheel = document.getElementById("wheel");
            spinPrizes.forEach((prize, i) => {
                let textEl = document.createElement("div");
                textEl.className = "wheel-text";
                textEl.style.transform = `rotate(${i * 45 + 22.5}deg)`;
                textEl.textContent = prize.text;
                wheel.appendChild(textEl);
            });
        }

        function bukaSpin() {
            if(isSpinning) return;
            document.getElementById("modalSpin").style.display = "flex";
        }

        function spinWheel() {
            if(isSpinning) return;
            if(coins < 50) {
                alert("❌ Koin tidak cukup! Butuh 50 Koin.");
                return;
            }
            
            coins -= 50;
            updateCoinUI();
            isSpinning = true;
            document.getElementById("btnSpinAction").disabled = true;
            playSFX('coin');

            const randomIndex = Math.floor(Math.random() * spinPrizes.length);
            const prize = spinPrizes[randomIndex];

            const baseSpins = 360 * 5;
            const prizeAngle = (randomIndex * 45) + 22.5;
            const targetAngle = baseSpins - prizeAngle;

            const wheel = document.getElementById("wheel");
            wheel.style.transform = `rotate(${targetAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                document.getElementById("btnSpinAction").disabled = false;

                let alertMsg = "";
                if(prize.type === 'coin') {
                    coins += prize.val; updateCoinUI(); playSFX('coin');
                    alertMsg = `Selamat! Kamu mendapatkan ${prize.val} Koin!`;
                    showFloatingText(`+${prize.val} 🪙`, "var(--accent)");
                } 
                else if(prize.type === 'hint') {
                    inventory.range++; updateInventoryUI(); playSFX('win');
                    alertMsg = `Selamat! Kamu mendapatkan 1x Petunjuk 50:50!`;
                }
                else if(prize.type === 'life') {
                    if(kesempatan < 5) { kesempatan++; updateLivesUI(); }
                    playSFX('win');
                    alertMsg = `Selamat! Kamu mendapatkan 1x Nyawa Tambahan!`;
                }
                else if(prize.type === 'win') {
                    inventory.win++; updateInventoryUI(); playSFX('win');
                    alertMsg = `WOW! Kamu mendapatkan Instan Win!`;
                }
                else {
                    playSFX('wrong');
                    alertMsg = `Yah, ZONK! Kamu tidak mendapatkan apa-apa.`;
                }

                alert(alertMsg);
                
                wheel.style.transition = 'none';
                wheel.style.transform = `rotate(0deg)`;
                setTimeout(() => { wheel.style.transition = 'transform 4s cubic-bezier(0.25, 0.1, 0.25, 1)'; }, 100);

                tutupModal('modalSpin');
            }, 4000);
        }
    </script>
</body>
</html>
